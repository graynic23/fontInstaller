name: buildbrax34ks
on: [push, workflow_dispatch]
jobs:
build:
runs-on: ubuntu-latest
container: vitasdk/vitasdk
steps:
- uses: actions/checkout@v4
- name: Install vita2d
run: vdpm vita2d
- name: Build
run: |
mkdir build && cd build
cmake .. && make
- uses: actions/upload-artifact@v4
with:
name: output
path: build/*.vpk
